# 官网 www、客户入口 go、Widget CDN（正式域名见 docs/38-production-domains.md）
# HTTPS：
#   certbot --nginx -d www.qiyuntu.cn -d go.qiyuntu.cn -d cdn.qiyuntu.cn

upstream qiyun_public_console {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.qiyuntu.cn go.qiyuntu.cn;
    client_max_body_size 25m;

    # Sales-link redirects are API-owned so visits are counted atomically.
    location ^~ /public/sales-links/ {
        proxy_pass http://qiyun_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://qiyun_public_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn.qiyuntu.cn;

    location = /public/widget.js {
        proxy_pass http://qiyun_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 10m;
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        return 404;
    }
}
