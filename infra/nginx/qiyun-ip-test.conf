# Temporary HTTP entry for acceptance testing before ICP filing is approved.
# Remove this server after the production domains are available over HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.201.63.118 _;

    client_max_body_size 25m;

    location = /health {
        proxy_pass http://qiyun_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /public/widget.js {
        proxy_pass http://qiyun_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Temporary direct API prefix used by automated acceptance tests. The
    # trailing slash removes /backend/ before forwarding to apps/api.
    location ^~ /backend/ {
        proxy_pass http://qiyun_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Console owns /api as a same-origin BFF and forwards requests to the
    # private API container, so login cookies also work on the IP host.
    location / {
        proxy_pass http://qiyun_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
