# API 公网入口（api.qiyuntu.cn）；Widget 静态脚本见 qiyun-public.conf → cdn.qiyuntu.cn
# 安装：
#   sudo cp infra/nginx/qiyun-api.conf /etc/nginx/sites-available/qiyun-api
#   sudo ln -sf /etc/nginx/sites-available/qiyun-api /etc/nginx/sites-enabled/qiyun-api
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS（DNS 解析生效后）：
#   certbot --nginx -d api.qiyuntu.cn

upstream qiyun_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.qiyuntu.cn;

    client_max_body_size 25m;

    location / {
        proxy_pass http://qiyun_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / 长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
