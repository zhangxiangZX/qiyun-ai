# Console 管理后台（console.qiyuntu.cn）
# 正式域名见 docs/38-production-domains.md
# 安装：
#   sudo cp infra/nginx/qiyun-console.conf /etc/nginx/sites-available/qiyun-console
#   sudo ln -sf /etc/nginx/sites-available/qiyun-console /etc/nginx/sites-enabled/qiyun-console
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS（DNS 解析生效后）：
#   certbot --nginx -d console.qiyuntu.cn

upstream qiyun_console {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.qiyuntu.cn;

    client_max_body_size 25m;

    location / {
        proxy_pass http://qiyun_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
