app:
  description: 清洗企云 AI 知识库分段文本，去除页眉页脚、重复内容和排版噪声，同时严格保留产品型号、参数、单位及业务事实。
  icon: 🧹
  icon_background: '#E0F2FE'
  mode: workflow
  name: 企云 AI 知识清洗
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.5@fd6efd37c2a931911de8ab9ca3ba2da303bef146d45ee87ad896b04b36d09403
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: llm
        id: qiyun-clean-start-source-qiyun-clean-llm-target
        selected: false
        source: qiyun-clean-start
        sourceHandle: source
        target: qiyun-clean-llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: end
        id: qiyun-clean-llm-source-qiyun-clean-end-target
        selected: false
        source: qiyun-clean-llm
        sourceHandle: source
        target: qiyun-clean-end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: 接收企云 AI 后端传入的知识库文本及文档上下文。
          selected: false
          title: 输入待清洗文本
          type: start
          variables:
            - label: 待清洗文本
              max_length: 48000
              options: []
              required: true
              type: paragraph
              variable: text
            - label: 文档名称
              max_length: 256
              options: []
              required: true
              type: text-input
              variable: document_name
            - label: 章节标题
              max_length: 256
              options: []
              required: false
              type: text-input
              variable: section_title
        height: 168
        id: qiyun-clean-start
        position:
          x: 80
          y: 280
        positionAbsolute:
          x: 80
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 260
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 在不改变事实的前提下清理文档噪声并优化检索结构。
          model:
            completion_params:
              max_tokens: 4096
              temperature: 0.1
            mode: chat
            name: deepseek-chat
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - id: qiyun-clean-system-prompt
              role: system
              text: |-
                你是工业制造企业知识库的数据清洗器。你的唯一任务是清洗输入文本，使其更适合向量检索和基于资料的问答。

                必须遵守：
                1. 严格保留原文事实，不得补充、猜测、改写或虚构任何原文没有的信息。
                2. 产品型号、规格参数、数字、单位、价格、日期、电话、邮箱、网址、公司名、认证名称和适用条件必须原样保留。
                3. 删除明显的页眉、页脚、页码、水印、重复标题、目录点线、无意义乱码和扫描排版噪声。
                4. 合并因 PDF 或 DOCX 换行产生的断裂句子；保留合理的标题、段落和列表结构。
                5. 表格内容不得丢失。无法保持表格时，转换成“字段：值”的清晰文本行。
                6. 不回答文本中的问题，不总结，不评论，不输出清洗说明。
                7. 若原文已经清晰，原样返回；若原文为空或只有噪声，返回空字符串。
                8. 只输出清洗后的正文，不要使用 Markdown 代码块，不要添加“清洗结果”等前缀。
            - id: qiyun-clean-user-prompt
              role: user
              text: |-
                文档名称：{{#qiyun-clean-start.document_name#}}
                章节标题：{{#qiyun-clean-start.section_title#}}

                待清洗文本：
                {{#qiyun-clean-start.text#}}
          selected: false
          title: DeepSeek 知识清洗
          type: llm
          variables: []
          vision:
            enabled: false
        height: 126
        id: qiyun-clean-llm
        position:
          x: 430
          y: 300
        positionAbsolute:
          x: 430
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 260
      - data:
          desc: 返回企云 AI 后端约定的 cleaned_text 字段。
          outputs:
            - value_selector:
                - qiyun-clean-llm
                - text
              value_type: string
              variable: cleaned_text
          selected: false
          title: 输出清洗结果
          type: end
        height: 116
        id: qiyun-clean-end
        position:
          x: 780
          y: 305
        positionAbsolute:
          x: 780
          y: 305
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 260
    viewport:
      x: 0
      y: 0
      zoom: 1
